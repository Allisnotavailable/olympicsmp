<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympic SMP | Anarchy Minecraft Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #142850 0%, #0c1b33 50%, #030811 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        /* Minecraft Dirt/Grid Sub-texture overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(12, 27, 51, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1.25rem;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            display: block;
        }

        .server-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.1;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
        }

        .server-title span {
            color: #4da8da;
        }

        .server-type {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 1.25rem;
            font-weight: 600;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.75rem;
        }

        .tag {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #d1d5db;
        }

        .ip-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .ip-card:active {
            transform: scale(0.98);
        }

        .ip-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 0.3rem;
        }

        .ip-address {
            font-size: 1.05rem;
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #ffffff;
            word-break: break-all;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .social-icon:active {
            transform: scale(0.92);
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        @media (max-width: 360px) {
            .container {
                padding: 2rem 1rem;
            }
            .server-title {
                font-size: 1.8rem;
            }
            .logo {
                width: 95px;
                height: 95px;
            }
        }
    </style>
</head>
<body>

        <!-- Logo -->
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="Olympic SMP Logo" class="logo">

        <!-- Server Title & Type -->
        <h1 class="server-title">Olympic <span>SMP</span></h1>
        <p class="server-type">Anarchy Server</p>
